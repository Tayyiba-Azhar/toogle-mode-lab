<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter & Theme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="themeToggle" class="theme-btn">Dark Mode</button>

    <div class="counter-card">
        <h2>Click Counter</h2>
        <div id="counterValue">0</div>
        
        <div class="button-group">
            <button id="decreaseBtn" class="action-btn value-btn">-1</button>
            <button id="resetBtn" class="action-btn reset-btn">Reset</button>
            <button id="increaseBtn" class="action-btn value-btn">+1</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
